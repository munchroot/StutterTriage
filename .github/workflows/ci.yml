name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  core:
    name: 离线回归（core）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 安装锁定依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: 运行 core 测试（统一入口 scripts/test.ps1）
        shell: pwsh
        run: ./scripts/test.ps1 -Suite core

  integration:
    # 真实 ETW / 会话清理用例：结果单独报告，不阻塞普通提交。
    # 需要管理员会话，GitHub 托管的 Windows runner 默认满足；手动触发才跑。
    name: 真实 ETW 集成（integration）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 安装锁定依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: 运行 integration 测试
        shell: pwsh
        run: ./scripts/test.ps1 -Suite integration
