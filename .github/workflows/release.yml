name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: 构建并发布 Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 安装锁定依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: 发布前跑离线回归
        shell: pwsh
        run: ./scripts/test.ps1 -Suite core

      - name: 打包（版本一致性 + PresentMon 必检 + PE 版本 + SHA-256）
        shell: pwsh
        run: ./build_tools/build_exe.ps1 -Release -Tag ${{ github.ref_name }}

      - name: 复核产物
        shell: pwsh
        run: |
          Get-Content dist\SHA256SUMS.txt
          if (-not (Test-Path dist\StutterTriage.exe)) { throw '缺少 dist\StutterTriage.exe' }
          $h = (Get-FileHash dist\StutterTriage.exe -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content dist\SHA256SUMS.txt -Raw).Split(' ')[0].Trim()
          if ($h -ne $expected) { throw "校验值不一致：$h != $expected" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StutterTriage-${{ github.ref_name }}
          path: |
            dist/StutterTriage.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY.md
          if-no-files-found: error

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StutterTriage.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY.md
          generate_release_notes: true
          fail_on_unmatched_files: true
